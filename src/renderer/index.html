<!DOCTYPE html>
<html>
<head>
  <title>Printer Middleware</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 32px; }
    .status { margin: 12px 0; font-weight: bold; }
    .status.ok { color: #080; }
    .status.error { color: #b00; }
    .log { font-family: monospace; background: #f9f9f9; border: 1px solid #eee; padding: 8px; max-height: 220px; overflow-y: auto; }
    #openSettings { float: right; }
    .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; }
    .modal-content { background: #fff; padding: 24px 32px; border-radius: 8px; min-width: 340px; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .modal input { width: 100%; margin-bottom: 12px; padding: 6px; }
    .modal label { font-weight: bold; }
    .modal button { margin-top: 8px; }
    #openSettings { float: right; }
  </style>
</head>
<body>
  <h1>Printer Middleware <button id="openSettings">⚙️ Setup</button></h1>
  <div id="connectivityStatus" class="status">Checking connectivity...</div>
  <div id="printerStatus" class="status"></div>
  <h2>Live Logs</h2>
  <div class="log" id="appLog"></div>

  <!-- Modal for Settings -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Setup</h2>
      <label for="deviceIdInput">Device ID:</label>
      <input type="text" id="deviceIdInput" placeholder="Enter device ID">
      <label for="apiKeyInput">API Key:</label>
      <input type="text" id="apiKeyInput" placeholder="Paste API key">
      <label for="wsUrlInput">Middleware Server URL:</label>
      <input type="text" id="wsUrlInput" placeholder="ws://server:4000">
      <button id="saveSettings">Save & Restart</button>
      <button id="closeSettings" style="float:right;">Cancel</button>
      <div id="settingsStatus" class="status"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
